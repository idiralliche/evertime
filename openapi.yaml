      security: [ { bearerAuth: [] } ]
      parameters: [ { name: device_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatResponse' } } } }

